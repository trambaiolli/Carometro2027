<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carômetro de Alunos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="appShell">
      <aside class="sidebar">
        <h1>Carômetro de Alunos</h1>
        <h2>Turmas</h2>
        <nav id="tabs" aria-label="Filtrar alunos por turma"></nav>
      </aside>
      <div class="areaPrincipal">
        <header>
          <input
            id="busca"
            type="search"
            placeholder="Buscar aluno por nome, email ou telefone..."
          />
          <div class="acoesTopo">
            <button id="gerarTurma">Gerar turma</button>
            <button id="editarTurma" hidden>Editar nome</button>
            <button id="excluirTurma" hidden>Excluir turma</button>
            <button id="imprimirTurma" hidden>Imprimir turma</button>
            <button id="novo" class="primario">+ Novo aluno</button>
            <div class="contaAtual">
              <span id="usuarioAtual"></span>
              <button id="sair" type="button">Sair</button>
            </div>
          </div>
        </header>
        <section id="cabecalhoImpressao" class="cabecalhoImpressao" hidden>
          <p>CARÔMETRO DE ALUNOS</p>
          <h1 id="tituloImpressao"></h1>
          <div class="detalhesImpressao">
            <span id="totalImpressao"></span>
            <time id="dataImpressao"></time>
          </div>
        </section>
        <main id="grid"></main>
      </div>
    </div>
    <dialog id="dlg">
      <form id="form" method="dialog">
        <h2 id="dlgTitulo"></h2>
        <label>Nome <input name="nome" required maxlength="120" /></label>
        <label
          >Email <input name="email" type="email" required maxlength="150"
        /></label>
        <label
          >Telefone <input name="telefone" required maxlength="20"
        /></label>
        <label
          >Foto (URL ou câmera)
          <input name="foto_url" placeholder="https://... ou use a câmera"
        /></label>
        <video id="video" autoplay playsinline muted hidden></video>
        <img id="preview" alt="Pré-visualização" hidden />
        <div class="acoes camera">
          <button type="button" id="abrirCam">Usar câmera</button>
          <button type="button" id="capturar" class="primario" hidden>
            Capturar
          </button>
        </div>
        <label
          >Turma
          <select name="turma_id" required></select
        ></label>
        <p id="erro" class="erro"></p>
        <div class="acoes">
          <button type="button" id="cancelar">Cancelar</button>
          <button type="submit" class="primario">Salvar</button>
        </div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
